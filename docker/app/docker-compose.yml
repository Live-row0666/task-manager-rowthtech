version: "3"
services:
  taskmanagerserver:
    image: taskmanagerserver
    build: ../../server
    container_name: taskmanagerserver
    restart: unless-stopped
    ports:
      - "9012:9012"
    environment:
      - PORT=9012
      - NODE_ENV=production
    volumes:
      - /etc/localtime:/etc/localtime:ro

  taskmanageradmin:
    image: taskmanageradmin
    build: ../../admin
    container_name: taskmanageradmin
    restart: unless-stopped
    ports:
      - "9013:9013"
    volumes:
      - /etc/localtime:/etc/localtime:ro

  taskmanageruser:
    image: taskmanageruser
    build: ../../user
    container_name: taskmanageruser
    restart: unless-stopped
    ports:
      - "9014:9014"
    volumes:
      - /etc/localtime:/etc/localtime:ro

  taskmanagerclient:
    image: taskmanagerclient
    build: ../../client
    container_name: taskmanagerclient
    restart: unless-stopped
    ports:
      - "9015:9015"
    volumes:
      - /etc/localtime:/etc/localtime:ro
