services:
  taskmanagerserver:
    image: taskmanagerserver-dev
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: taskmanagerserver-dev
    ports:
      - "9100:9100"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  taskmanageradmin:
    image: taskmanageradmin-dev
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: taskmanageradmin-dev
    ports:
      - "9101:9101"
    env_file:
      - ./admin/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    stdin_open: true
    tty: true
    restart: unless-stopped

  taskmanageruser:
    image: taskmanageruser-dev
    build:
      context: ./user
      dockerfile: Dockerfile.dev
    container_name: taskmanageruser-dev
    ports:
      - "9102:9102"
    env_file:
      - ./user/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./user:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    stdin_open: true
    tty: true
    restart: unless-stopped

  taskmanagerclient:
    image: taskmanagerclient-dev
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: taskmanagerclient-dev
    ports:
      - "9103:9103"
    env_file:
      - ./client/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./client:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    stdin_open: true
    tty: true
    restart: unless-stopped
